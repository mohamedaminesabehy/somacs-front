sonar.projectKey=somacs-front
sonar.projectName=SOMACS Frontend
sonar.projectVersion=1.0.0

# ── Sources ──────────────────────────────────────────────────────────────────
sonar.sources=src
sonar.exclusions=node_modules/**,dist/**,coverage/**,public/**

# ── Language & Encoding ──────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
sonar.javascript.node.maxspace=4096

# ── Coverage (no report provided — metric stays at 0.0%) ────────────────────
sonar.coverage.exclusions=**/*.spec.js,**/*.test.js
